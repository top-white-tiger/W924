
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W924 암호화 도구</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5fa;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000010;
    }

    h1 {
      text-align: center;
      color: #263b70;
      user-select: none;
    }

    h1 span {
      cursor: pointer;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #304b91;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #20376e;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .copy {
      background: #606b80;
    }

    .section-title {
      margin-top: 25px;
      font-weight: bold;
    }

    #output {
      min-height: 80px;
      padding: 14px;
      background: #f0f2f7;
      border-radius: 9px;
      overflow-wrap: anywhere;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    #status {
      text-align: center;
      color: #304b91;
      margin-top: 12px;
    }

    /* 비밀번호 화면 */
    #loginScreen {
      max-width: 570px;
      min-height: 420px;
      margin: 0 auto;
      background: white;
      padding: 45px;
      border-radius: 22px;
      box-shadow: 0 4px 30px #00000010;
      text-align: center;
    }

    #loginScreen h2 {
      color: #263b70;
      margin-top: 20px;
    }

    #passwordInput {
      width: 100%;
      padding: 17px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
      margin-top: 35px;
    }

    #loginStatus {
      color: #b33;
      margin-top: 15px;
      min-height: 20px;
    }

    /* 힌트 */
    #hintArea {
      margin-top: 18px;
    }

    #hintButton {
      background: #606b80;
    }

    #hintText {
      display: none;
      margin-top: 14px;
      padding: 15px;
      background: #f0f2f7;
      border-radius: 9px;
      color: #304b91;
    }

    /* 재입력 화면 경고 */
    #warningText {
      position: fixed;
      bottom: 14px;
      right: 16px;
      font-size: 12px;
      color: #555;
      opacity: 0.25;
      pointer-events: none;
      display: none;
    }

    /* 공포 연출 후 안내 */
    #finalNotice {
      display: none;
      margin-top: 25px;
      padding: 15px;
      background: #f0f2f7;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.8;
      color: #666;
    }

    /* 이스터에그 */
    #secretMessage {
      position: fixed;
      bottom: 12px;
      left: 14px;
      font-size: 11px;
      line-height: 1.6;
      color: #777;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s;
    }

    #secretMessage.show {
      opacity: 0.45;
    }

    /* 공포 화면 */
    #horrorScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #080808;
      overflow: hidden;
    }

    /* 순서대로 나타나는 문장 줄 */
    .horrorRow {
      position: absolute;
      left: 0;
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding: 0 12px;
      overflow: visible;
      white-space: nowrap;
    }

    .horrorRow.center {
      justify-content: center;
    }

    .horrorText {
      color: #ff1717;
      font-weight: 900;
      font-size: clamp(17px, 3.5vw, 32px);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* 마지막 혼란 단계 */
    .chaosText {
      position: absolute;
      color: #ff1717;
      font-weight: 900;
      white-space: nowrap;
      font-size: clamp(20px, 4vw, 42px);
      animation: chaosShake 0.1s infinite alternate;
      user-select: none;
    }

    #horrorTitle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff1717;
      font-size: clamp(28px, 7vw, 65px);
      font-weight: 900;
      white-space: nowrap;
      z-index: 2;
      animation: titleShake 0.09s infinite;
    }

    @keyframes titleShake {
      0% {
        transform: translate(-50%, -50%) rotate(-1deg);
      }
      25% {
        transform: translate(-51%, -49%) rotate(1deg);
      }
      50% {
        transform: translate(-49%, -51%) rotate(-1.5deg);
      }
      75% {
        transform: translate(-50%, -50%) rotate(1deg);
      }
      100% {
        transform: translate(-51%, -50%) rotate(0deg);
      }
    }

    @keyframes chaosShake {
      0% {
        transform: translate(0, 0) rotate(-2deg);
      }
      25% {
        transform: translate(3px, -2px) rotate(2deg);
      }
      50% {
        transform: translate(-3px, 2px) rotate(-1deg);
      }
      75% {
        transform: translate(2px, 3px) rotate(2deg);
      }
      100% {
        transform: translate(-2px, -3px) rotate(-2deg);
      }
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 500px) {
      #loginScreen {
        padding: 30px 22px;
        min-height: 380px;
      }

      .horrorRow {
        gap: 6px;
        padding: 0 5px;
      }

      .horrorRow .horrorText {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- 비밀번호 화면 -->
  <div id="loginScreen">
    <h2>W924</h2>
    <p class="subtitle">PRIVATE ACCESS</p>

    <input
      type="password"
      id="passwordInput"
      placeholder="비밀번호를 입력하세요."
      autocomplete="off"
      onkeydown="if(event.key === 'Enter') checkPassword()"
    >

    <button onclick="checkPassword()">입장하기</button>

    <p id="loginStatus"></p>

    <div id="hintArea" hidden>
      <button id="hintButton" onclick="showHint()">힌트 보기</button>
      <div id="hintText">힌트: 1234입니다.</div>
    </div>

    <div id="finalNotice">
      힌트를 더 알고 싶으신가요?<br>
      지금 화면을 캡처하여 원호에게 물어보세요!
    </div>
  </div>

  <!-- 오른쪽 아래 경고 -->
  <div id="warningText">입력하면 안 돼</div>

  <!-- 메인 화면 -->
  <div class="container" id="mainApp" hidden>
    <h1>
      W<span onclick="secretClick('9')">9</span><span onclick="secretClick('2')">2</span><span onclick="secretClick('4')">4</span>
    </h1>

    <p class="subtitle">W924 TEXT ENCRYPTION</p>

    <p class="section-title">원문 또는 암호문 입력</p>

    <textarea
      id="input"
      placeholder="암호화하거나 복호화할 문장을 입력하세요."
    ></textarea>

    <button onclick="encrypt()">암호화</button>
    <button onclick="decrypt()">복호화</button>

    <p class="section-title">결과</p>
    <div id="output">결과가 여기에 표시됩니다.</div>

    <button class="copy" onclick="copyResult()">결과 복사</button>

    <p id="status"></p>
  </div>

  <!-- 공포 연출 화면 -->
  <div id="horrorScreen">
    <div id="horrorTitle">안 된다고 했잖아.</div>
    <div id="horrorRows"></div>
    <div id="chaosTexts"></div>
  </div>

  <!-- 이스터에그 -->
  <div id="secretMessage">
    이스터에그!<br>
    이원호는 아직 민채를 좋아합니다.<br>
    언제까지일지는 모르겠지만, 영원했으면 좋겠어요.
  </div>

  <script>
    // 비밀번호 상태
    let hintUsed = false;
    let confirmationMode = false;
    let horrorStarted = false;

    // 비밀번호 확인
    function checkPassword() {
      if (horrorStarted) return;

      const input = document.getElementById("passwordInput");
      const password = input.value.trim().toUpperCase();
      const loginStatus = document.getElementById("loginStatus");

      // 진짜 비밀번호
      if (password === "BFBC C4C4") {
        enterSite();
        return;
      }

      // 가짜 비밀번호 첫 번째 입력
      if (password === "1234" && hintUsed && !confirmationMode) {
        confirmationMode = true;

        loginStatus.textContent = "한 번 더 입력해주세요.";
        input.value = "";
        input.placeholder = "한 번 더 입력해주세요.";

        document.getElementById("warningText").style.display = "block";
        return;
      }

      // 가짜 비밀번호 두 번째 입력
      if (password === "1234" && confirmationMode) {
        startHorror();
        return;
      }

      loginStatus.textContent = "비밀번호가 올바르지 않습니다.";
      document.getElementById("hintArea").hidden = false;
    }

    // 힌트 표시
    function showHint() {
      hintUsed = true;

      document.getElementById("hintText").style.display = "block";
      document.getElementById("hintButton").textContent = "힌트 확인 완료";
      document.getElementById("hintButton").disabled = true;
    }

    // 정상 입장
    function enterSite() {
      document.getElementById("loginScreen").hidden = true;
      document.getElementById("warningText").style.display = "none";
      document.getElementById("mainApp").hidden = false;
    }

    // 문장 생성
    function createHorrorText(parent, className) {
      const text = document.createElement("div");
      text.className = className;
      text.textContent = "안 된다고 했잖아.";
      parent.appendChild(text);
      return text;
    }

    // 공포 연출 시작
    function startHorror() {
      horrorStarted = true;

      const loginStatus = document.getElementById("loginStatus");
      const horrorScreen = document.getElementById("horrorScreen");
      const horrorRows = document.getElementById("horrorRows");
      const chaosTexts = document.getElementById("chaosTexts");
      const horrorTitle = document.getElementById("horrorTitle");

      loginStatus.textContent = "입력 완료";

      setTimeout(() => {
        document.getElementById("loginScreen").hidden = true;
        horrorScreen.style.display = "block";

        horrorRows.innerHTML = "";
        chaosTexts.innerHTML = "";
        horrorTitle.style.display = "none";

        runOrderedHorror();
      }, 650);
    }

    // 1개 → 2개 → 3개 순서로 증가하는 단계
    function runOrderedHorror() {
      const horrorRows = document.getElementById("horrorRows");
      const horrorTitle = document.getElementById("horrorTitle");

      let rowNumber = 0;
      const rowHeight = 46;

      function addRow() {
        const y = 12 + rowNumber * rowHeight;

        // 화면 아래에 도달하면 혼란 단계 시작
        if (y + rowHeight > window.innerHeight - 12) {
          runChaosHorror();
          return;
        }

        const row = document.createElement("div");
        row.className = "horrorRow";

        // 줄마다 왼쪽 또는 중앙 정렬
        if (rowNumber % 2 === 1) {
          row.classList.add("center");
        }

        row.style.top = y + "px";

        // 1개, 2개, 3개... 점점 증가
        const count = rowNumber + 1;

        for (let i = 0; i < count; i++) {
          createHorrorText(row, "horrorText");
        }

        horrorRows.appendChild(row);
        rowNumber++;

        // 점점 빠르게 나타나도록 간격 감소
        const delay = Math.max(65, 520 - rowNumber * 28);

        setTimeout(addRow, delay);
      }

      addRow();
    }

    // 화면이 가득 찬 뒤 불규칙하게 흔들리는 단계
    function runChaosHorror() {
      const horrorRows = document.getElementById("horrorRows");
      const chaosTexts = document.getElementById("chaosTexts");
      const horrorTitle = document.getElementById("horrorTitle");

      horrorTitle.style.display = "block";

      // 기존 줄은 남겨두고 불규칙한 문장 추가
      for (let i = 0; i < 45; i++) {
        const text = createHorrorText(chaosTexts, "chaosText");

        text.style.left = Math.random() * 90 + "%";
        text.style.top = Math.random() * 95 + "%";
        text.style.fontSize = (20 + Math.random() * 35) + "px";
        text.style.animationDuration =
          (0.06 + Math.random() * 0.14) + "s";
        text.style.animationDelay = Math.random() * 0.3 + "s";
      }

      // 잠시 뒤 원래 화면으로 복귀
      setTimeout(() => {
        finishHorror();
      }, 2800);
    }

    // 공포 연출 종료
    function finishHorror() {
      document.getElementById("horrorScreen").style.display = "none";
      document.getElementById("horrorRows").innerHTML = "";
      document.getElementById("chaosTexts").innerHTML = "";
      document.getElementById("horrorTitle").style.display = "none";

      document.getElementById("loginScreen").hidden = false;

      const input = document.getElementById("passwordInput");
      input.value = "";
      input.placeholder = "비밀번호를 입력하세요.";

      document.getElementById("loginStatus").textContent = "";
      document.getElementById("warningText").style.display = "none";

      document.getElementById("finalNotice").style.display = "block";

      confirmationMode = false;
      horrorStarted = false;
    }

    // W924 암호화
    function encryptW924(text) {
      const result = [];

      for (const char of text) {
        const code = char.codePointAt(0);

        if (code > 0xFFFF) {
          throw new Error(
            "4자리 유니코드 범위를 벗어난 문자가 포함되어 있습니다."
          );
        }

        const hex = code
          .toString(16)
          .toUpperCase()
          .padStart(4, "0");

        const encrypted =
          hex[0] + hex[2] + hex[1] + hex[3];

        result.push(encrypted);
      }

      return result.join(" ");
    }

    // W924 복호화
    function decryptW924(text) {
      const result = [];
      const tokens = text.trim().split(/\s+/);

      for (const token of tokens) {
        if (!/^[0-9A-Fa-f]{4}$/.test(token)) {
          throw new Error(
            "올바르지 않은 암호문입니다. 4자리 16진수인지 확인해주세요."
          );
        }

        const hex =
          token[0] + token[2] + token[1] + token[3];

        result.push(String.fromCharCode(parseInt(hex, 16)));
      }

      return result.join("");
    }

    // 결과 표시
    function showResult(action) {
      const input = document.getElementById("input").value;
      const output = document.getElementById("output");
      const status = document.getElementById("status");

      if (input.length === 0) {
        output.textContent = "문장을 먼저 입력해주세요.";
        status.textContent = "";
        return;
      }

      try {
        output.textContent =
          action === "encrypt"
            ? encryptW924(input)
            : decryptW924(input);

        status.textContent =
          action === "encrypt"
            ? "암호화 완료!"
            : "복호화 완료!";
      } catch (error) {
        output.textContent = error.message;
        status.textContent = "";
      }
    }

    function encrypt() {
      showResult("encrypt");
    }

    function decrypt() {
      showResult("decrypt");
    }

    // 결과 복사
    async function copyResult() {
      const output = document.getElementById("output").textContent;
      const status = document.getElementById("status");

      if (
        output === "결과가 여기에 표시됩니다." ||
        output === "문장을 먼저 입력해주세요." ||
        output.startsWith("4자리 유니코드") ||
        output.startsWith("올바르지 않은 암호문")
      ) {
        status.textContent = "복사할 결과가 없습니다.";
        return;
      }

      try {
        await navigator.clipboard.writeText(output);
        status.textContent = "결과를 복사했습니다!";
      } catch (error) {
        status.textContent =
          "복사에 실패했습니다. 브라우저 권한을 확인해주세요.";
      }
    }

    // 이스터에그: 9번 → 2번 → 4번
    let secretStep = 0;
    let clickCount = 0;

    const secretSequence = [
      { number: "9", count: 9 },
      { number: "2", count: 2 },
      { number: "4", count: 4 }
    ];

    function secretClick(number) {
      if (secretStep >= secretSequence.length) return;

      const current = secretSequence[secretStep];

      if (number === current.number) {
        clickCount++;

        if (clickCount === current.count) {
          secretStep++;
          clickCount = 0;

          if (secretStep === secretSequence.length) {
            document
              .getElementById("secretMessage")
              .classList.add("show");
          }
        }
      } else {
        secretStep = 0;
        clickCount = number === "9" ? 1 : 0;
      }
    }
  </script>

</body>
</html>
